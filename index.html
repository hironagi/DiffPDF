<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF差分検出ツール</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs" type="module"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>PDF差分検出</h1>
        <p>旧版（左）と新版（右）のPDFを比較し、差分を新版上に赤色オーバーレイで表示します。</p>
      </header>

      <section class="controls">
        <label>
          旧PDF（左）
          <input id="oldPdf" type="file" accept="application/pdf" />
        </label>
        <label>
          新PDF（右）
          <input id="newPdf" type="file" accept="application/pdf" />
        </label>
        <label>
          検出強度: <span id="sensitivityValue">40</span>
          <input id="sensitivity" type="range" min="1" max="100" value="40" />
        </label>
        <label class="checkbox">
          <input id="showAll" type="checkbox" checked />
          すべてのページを表示（オフ時は差分があるページのみ）
        </label>
        <button id="compareBtn" type="button">差分を検出</button>
      </section>

      <section class="report">
        <h2>出力レポート</h2>
        <ul id="reportList"></ul>
      </section>

      <section id="viewer" class="viewer"></section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
